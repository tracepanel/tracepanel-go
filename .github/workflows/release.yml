name: Release

# A tag that names a version (v0.10.0, as Go modules name them) releases it: once CI has passed on the tagged commit
# (Windows' jobs among its jobs: the tests and an app against the real agent there),
# and the tag agrees with Version, AgentVersion is of its minor (a patch of its own) and the agent's checksums are of
# AgentVersion, it gets a GitHub release, and the Go module proxy is asked for it, so pkg.go.dev and `go get` have it
# at once. Then each integration (gintrace, pgxtrace and the others, a module of its own) is tagged on the same
# commit, <module>/v0.10.0, once it builds without its `replace` against the core the proxy now has. Nothing is
# uploaded: a Go module is its tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success")
                # Windows is where go run and the agent's download and start differ most: its jobs must have run.
                run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0].id')
                windows=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name | endswith("on windows-latest")) | select(.conclusion == "success")] | length')
                if [ "$windows" -lt 2 ]; then
                  echo "::error::CI on $GITHUB_SHA passed without its Windows jobs (tests, e2e): $windows of 2"
                  exit 1
                fi
                echo "CI passed on $GITHUB_SHA, on Windows too" && exit 0 ;;
              completed*) echo "::error::CI on $GITHUB_SHA: $result" && exit 1 ;;
              "null null") [ "$attempt" -ge 10 ] && echo "::error::no CI run of main on $GITHUB_SHA" && exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA still runs" && exit 1

  release:
    name: Release on GitHub and the module proxy
    needs: ci
    runs-on: ubuntu-latest
    # Two waits for the module proxy of up to 10 minutes each.
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      - name: The tag is the version, the agent of its minor, and its checksums of it
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)
          agent=$(sed -n 's/^const AgentVersion = "\(.*\)"$/\1/p' version.go)
          checksums=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/agentbin/integrity.go)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "${agent%.*}" != "${version%.*}" ] || [ "$checksums" != "$agent" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Version $version, AgentVersion $agent, checksums of $checksums: the tag is the version, the agent of its minor, and make integrity was run for it"
            exit 1
          fi
      - name: Each integration requires the core of the tag
        run: |
          for module in $(sed -n 's/^MODULES := //p' Makefile); do
            [ "$module" = . ] && continue
            required=$(awk '{ sub(/^require[ \t]+/, "") } $1 == "github.com/tracepanel/tracepanel-go" && $2 ~ /^v/ { print $2 }' "$module/go.mod")
            if [ "$required" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$module/go.mod requires the core ${required:-nowhere}, not $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: GitHub release, its notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v head="## $version " 'index($0, head) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          # A re-run after a later step failed finds the release made.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME is there already"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
      # Right after a push the proxy may not see the tag yet and answer 404 (and keep that miss a while): it is asked
      # again, waiting longer each time, for up to 10 minutes.
      - name: The module proxy fetches it
        run: |
          url="https://proxy.golang.org/github.com/tracepanel/tracepanel-go/@v/$GITHUB_REF_NAME.info"
          deadline=$((SECONDS + 600)) delay=10
          until curl --fail --silent --show-error "$url"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the module proxy has no $GITHUB_REF_NAME after 10 minutes"
              exit 1
            fi
            echo "The module proxy has no $GITHUB_REF_NAME yet, asking again in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2 > 120 ? 120 : delay * 2))
          done
      # The `replace` of the core to the checkout is for this repository only (Go ignores a dependency's replace), so
      # each integration is built as an app gets it: with the core from the proxy.
      - name: Each integration builds against the released core
        env:
          GOFLAGS: -mod=mod
        run: |
          for module in $(sed -n 's/^MODULES := //p' Makefile); do
            [ "$module" = . ] && continue
            copy=$(mktemp -d) && cp -R "$module/." "$copy"
            (cd "$copy" && go mod edit -dropreplace=github.com/tracepanel/tracepanel-go && go build ./... && go vet ./...) || exit 1
          done
      # All the tags are pushed at once, then the proxy is asked for each, as the core above. A tag on the remote
      # already (a re-run after a failure) is kept if it is of this commit, so a re-run tags only the rest.
      - name: The integrations' tags, and the module proxy fetches them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tags=() new=()
          for module in $(sed -n 's/^MODULES := //p' Makefile); do
            [ "$module" = . ] && continue
            tag="$module/$GITHUB_REF_NAME"
            tags+=("$tag")
            remote=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
            if [ -z "$remote" ]; then
              git tag "$tag" "$GITHUB_SHA"
              new+=("$tag")
            elif [ "$remote" = "$GITHUB_SHA" ]; then
              echo "$tag is on the remote already"
            else
              echo "::error::$tag is on the remote already, of $remote, not $GITHUB_SHA"
              exit 1
            fi
          done
          if [ "${#new[@]}" -gt 0 ]; then
            git push origin "${new[@]}"
            sleep 30
          fi
          deadline=$((SECONDS + 600))
          for tag in "${tags[@]}"; do
            module=${tag%/*} delay=10
            until curl --fail --silent --show-error "https://proxy.golang.org/github.com/tracepanel/tracepanel-go/$module/@v/$GITHUB_REF_NAME.info"; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::the module proxy has no $tag after 10 minutes"
                exit 1
              fi
              echo "The module proxy has no $tag yet, asking again in ${delay}s"
              sleep "$delay"
              delay=$((delay * 2 > 120 ? 120 : delay * 2))
            done
          done
