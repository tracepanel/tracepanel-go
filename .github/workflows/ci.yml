name: CI

# gofmt, go vet and the tests with the race detector, of the core and of each integration (a module of its own, as
# `make lint` loops them), on every Go the modules support, on Linux, macOS and Windows; every module built for
# Windows on amd64 and arm64; then an app against the real agent (e2e/), the one the SDK downloads, on Linux and on
# Windows (its .exe from the agent's win32 package, started and stopped there). A release waits for all of it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold module and build cache: every module's tests with the race detector take most of it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        os: [ubuntu-latest]
        include:
          - go: "1.27"
            os: macos-latest
          - go: "1.27"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet and the tests of every module
        shell: bash
        run: |
          for module in $(sed -n 's/^MODULES := //p' Makefile); do
            echo "::group::$module"
            (cd "$module" && go vet ./... && go test -race ./...) || exit 1
            echo "::endgroup::"
          done
      # Once: the newest Go's.
      - name: Every module built for Windows, amd64 and arm64
        if: runner.os == 'Linux' && matrix.go == '1.27'
        run: make cross

  e2e:
    name: An app against the real agent on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: e2e/go.sum
      # The agent is AgentVersion's, downloaded from npm by the SDK itself and checked against its checksum, as an
      # app gets it; its OpenTelemetry port stays closed.
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l e2e)" || (gofmt -l e2e && exit 1)
      - run: go vet ./...
        working-directory: e2e
      - run: go test -race -count=1 ./...
        working-directory: e2e
